name: Tests

# The full suite, off the owner's Macs. Every branch push runs everything
# here, so the local pre-commit guards can stay scoped to the files being
# changed, and the merge onto main can accept this run's verdict instead of
# repeating it — see Guard 4 in .githooks/pre-commit. Public repo: macOS
# runners are free, up to five at once.
on:
  push:
    paths:
      - 'AudioutCore/**'
      - 'AirPlayEngine/**'
      - 'scripts/run-tests.sh'
      - 'scripts/lib/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audioutcore:
    runs-on: macos-26
    env:
      # No second Mac to route to, no machine-wide permit pool to share, and no
      # earlier pass to reuse: this runner exists to produce a fresh verdict.
      AUDIOUT_BUILD_LOCAL: "1"
      AUDIOUT_TEST_NO_LOCK: "1"
      AUDIOUT_TEST_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      # Compiled dependencies and the app's own modules from the last run.
      # Keyed on the lockfile so a dependency bump starts clean; restore-keys
      # takes the newest cache otherwise, and SwiftPM rebuilds only what
      # changed. Without this every run is a cold compile of everything.
      - uses: actions/cache@v4
        with:
          path: AudioutCore/.build
          key: audioutcore-build-${{ runner.os }}-${{ hashFiles('AudioutCore/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            audioutcore-build-${{ runner.os }}-${{ hashFiles('AudioutCore/Package.resolved') }}-
            audioutcore-build-${{ runner.os }}-
      - name: Install build dependencies
        run: brew install libevent libsodium libgcrypt libgpg-error libplist ffmpeg
      - name: AudioutCore suite
        run: bash scripts/run-tests.sh
  airplayengine:
    runs-on: macos-26
    env:
      AUDIOUT_BUILD_LOCAL: "1"
      AUDIOUT_TEST_NO_LOCK: "1"
      AUDIOUT_TEST_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: AirPlayEngine/.build
          key: airplayengine-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: airplayengine-build-${{ runner.os }}-
      - name: Install build dependencies
        run: brew install libevent libsodium libgcrypt libgpg-error libplist ffmpeg
      - name: AirPlayEngine suite
        run: AUDIOUT_TEST_PACKAGE=AirPlayEngine bash scripts/run-tests.sh
