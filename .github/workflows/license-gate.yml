name: License gate

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'AudioutCore/**'
      - 'AirPlayEngine/**'
      - '.github/workflows/license-gate.yml'
  workflow_dispatch:

concurrency:
  group: license-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-script-fails-without-license-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify make-release.sh refuses to build without AUDIOUT_LICENSE_URL
        run: |
          set +e
          OUTPUT="$(APP_VERSION=9.9.9 BUILD_NUMBER=999 bash scripts/make-release.sh /tmp/never-used 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "ERROR: make-release.sh exited 0 without AUDIOUT_LICENSE_URL set" >&2
            exit 1
          fi
          echo "$OUTPUT" | grep -qF "AUDIOUT_LICENSE_URL must be set" || { echo "ERROR: expected error message 'AUDIOUT_LICENSE_URL must be set' not found in output" >&2; exit 1; }
          echo "ok - release script refuses to build without a licence URL"
      - name: Run the licence-guard tests (plist cases skip on Linux)
        run: bash scripts/test-license-guards.sh
