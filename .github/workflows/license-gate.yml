name: License gate

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'AudioutCore/**'
      - 'AirPlayEngine/**'
      - '.github/workflows/license-gate.yml'
  workflow_dispatch:

concurrency:
  group: license-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-script-fails-without-license-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify make-release.sh refuses to build without AUDIOUT_LICENSE_URL
        run: |
          set +e
          OUTPUT="$(APP_VERSION=9.9.9 BUILD_NUMBER=999 bash scripts/make-release.sh /tmp/never-used 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "ERROR: make-release.sh exited 0 without AUDIOUT_LICENSE_URL set" >&2
            exit 1
          fi
          echo "$OUTPUT" | grep -qF "AUDIOUT_LICENSE_URL must be set" || { echo "ERROR: expected error message 'AUDIOUT_LICENSE_URL must be set' not found in output" >&2; exit 1; }
          echo "ok - release script refuses to build without a licence URL"
      - name: Run the licence-guard tests (plist cases skip on Linux)
        run: bash scripts/test-license-guards.sh

  build-invariants:
    # macos-26 (Xcode 26.x): matches the Swift toolchains on both of Alec's
    # Macs; macos-15's Xcode 16.4 is older than anything this repo is built
    # with locally.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run the licence-guard tests (macOS, includes the plist cases)
        run: bash scripts/test-license-guards.sh
      - name: Install build dependencies
        run: brew install libevent libsodium libgcrypt libgpg-error libplist ffmpeg
      - name: Build without a licence URL (source build)
        env:
          POSTHOG_PROJECT_TOKEN: ci-dummy
          POSTHOG_HOST: https://example.invalid
        run: bash scripts/make-app.sh
      - name: Unlicensed build must carry no gate key
        run: |
          if plutil -extract AudioutLicenseServerURL raw -o - build/Audiout.app/Contents/Info.plist 2>/dev/null; then
            echo "ERROR: unlicensed build carries AudioutLicenseServerURL" >&2
            exit 1
          fi
          echo "ok - unlicensed build has no gate key"
      - name: Build with a licence URL (licensed build)
        env:
          POSTHOG_PROJECT_TOKEN: ci-dummy
          POSTHOG_HOST: https://example.invalid
          AUDIOUT_LICENSE_URL: https://example.invalid
          SPARKLE_ED_PUBLIC_KEY: ci-dummy-key
          BUILD_NUMBER: 999
        run: bash scripts/make-app.sh
      - name: Licensed build must carry the gate key
        run: |
          VALUE="$(plutil -extract AudioutLicenseServerURL raw -o - build/Audiout.app/Contents/Info.plist)"
          [ "$VALUE" = "https://example.invalid" ] || { echo "ERROR: expected https://example.invalid, got '$VALUE'" >&2; exit 1; }
          echo "ok - licensed build carries $VALUE"
