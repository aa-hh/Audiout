# Per-project settings for the hooks and scripts. Sourced by sh; keep it
# plain KEY="value" lines. This is the only file a new project must edit
# before the guards do anything useful.

# Paths (git pathspecs, space-separated) whose changes count as code. A commit
# staging any of these runs scripts/test.sh before it is created (Guard 4).
SOURCE_PATHS="src/ tests/"

# File extensions (no dot, space-separated) whose added comment lines
# Guard 7 screens for slop. Comment markers recognised: //  #  --  /* *
COMMENT_EXTS="ts tsx js py swift go rs sh"

# Set to 0 to skip the test run at commit (pre-push still runs it).
TEST_ON_COMMIT=1

# Set to 0 to let pre-push skip the full suite (not recommended: with no CI,
# pre-push is the only place the full suite is guaranteed to run).
TEST_ON_PUSH=1
