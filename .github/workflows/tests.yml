name: Tests

# The full suite, off the owner's Macs. Every branch push runs everything
# here, so the local pre-commit guards can stay scoped to the files being
# changed, and the merge onto main can accept this run's verdict instead of
# repeating it — see Guard 4 in .githooks/pre-commit. Public repo: macOS
# runners are free, up to five at once.
on:
  push:
    paths:
      - 'AudioutCore/**'
      - 'AirPlayEngine/**'
      - 'scripts/run-tests.sh'
      - 'scripts/lib/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audioutcore:
    runs-on: macos-26
    env:
      # No second Mac to route to, no machine-wide permit pool to share, and no
      # earlier pass to reuse: this runner exists to produce a fresh verdict.
      AUDIOUT_BUILD_LOCAL: "1"
      AUDIOUT_TEST_NO_LOCK: "1"
      AUDIOUT_TEST_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (trees only, no blobs) for the mtime step below.
          fetch-depth: 0
          filter: blob:none
      # SwiftPM decides what to recompile by each source file's mtime, and
      # checkout stamps every file with "now", so the restored .build below
      # looked stale for every module in this repo and the cache only ever
      # spared the dependency checkouts (measured: 447 of 716 compile steps
      # re-ran on a push that touched no Swift). Give each tracked file the
      # time of the commit that last touched it: identical across runs for
      # untouched files, newer for the ones this push changed.
      - name: Restore source mtimes from git history
        run: |
          git -c core.quotePath=false log --format='@@%cd' --date=format:%Y%m%d%H%M.%S --name-only --no-renames HEAD \
            | awk '/^@@/ {t=substr($0,3); next} $0 != "" && !seen[$0]++ {print t "\t" $0}' \
            | while IFS="$(printf '\t')" read -r t f; do [ -f "$f" ] && touch -t "$t" "$f"; done
          echo "restored $(git ls-files | wc -l | tr -d ' ') tracked files"
      # Compiled dependencies and the app's own modules from the last run.
      # Keyed on the lockfile so a dependency bump starts clean; restore-keys
      # takes the newest cache otherwise, and SwiftPM rebuilds only what
      # changed. Without this every run is a cold compile of everything.
      # Restore and save are separate steps so the compiled tree is kept even
      # when a test fails — the plain cache action only saves after a green
      # job, and a red run's compile is worth exactly as much next time.
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: AudioutCore/.build
          key: audioutcore-build-${{ runner.os }}-${{ hashFiles('AudioutCore/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            audioutcore-build-${{ runner.os }}-${{ hashFiles('AudioutCore/Package.resolved') }}-
            audioutcore-build-${{ runner.os }}-
      - name: Install build dependencies
        run: brew install libevent libsodium libgcrypt libgpg-error libplist ffmpeg
      - name: AudioutCore suite
        run: bash scripts/run-tests.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: AudioutCore/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
  airplayengine:
    runs-on: macos-26
    env:
      AUDIOUT_BUILD_LOCAL: "1"
      AUDIOUT_TEST_NO_LOCK: "1"
      AUDIOUT_TEST_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: AirPlayEngine/.build
          key: airplayengine-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: airplayengine-build-${{ runner.os }}-
      - name: Install build dependencies
        run: brew install libevent libsodium libgcrypt libgpg-error libplist ffmpeg
      - name: AirPlayEngine suite
        run: AUDIOUT_TEST_PACKAGE=AirPlayEngine bash scripts/run-tests.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: AirPlayEngine/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
