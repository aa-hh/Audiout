<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenes B mock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2B2C2F; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
         -webkit-font-smoothing: antialiased; padding: 36px 40px; width: 1554px; }
  .grid { display: grid; grid-template-columns: 713px 713px; column-gap: 48px; row-gap: 34px; }
  .label { color: #EDEDEF; font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .note { color: #A3A4A9; font-size: 12px; margin-bottom: 10px; height: 15px; }
  .shell { position: relative; width: 713px; border-radius: 12px; overflow: hidden; }
  .abs { position: absolute; white-space: nowrap; }
  .ell { overflow: hidden; text-overflow: ellipsis; }
  svg.layer { position: absolute; left: 0; top: 0; pointer-events: none; }
  .pill { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 9px;
          font-size: 11px; margin-right: 3px; border: 1px solid; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
const T = {
  dark: { shell:'#15171A', strip:'#1D1F23', label:'#E8E8EA', label2:'#B7AC95', label3:'#9E947F',
    cool:'#A9B3BB', cool2:'#818C94', hair:'#2A2E33', edge:'#3D4247', rim:'#6B767D',
    gold:'#E8B84B', goldText:'#E8B84B', ember:'#8A6A2F', emberText:'#A98341', failure:'#D9564A',
    magenta:'#FF90E9', glowA:0.22, socket:'#2A2E33', well:'#050507', raised:'#1F232A',
    wash:'rgba(255,255,255,0.06)', washSel:'rgba(255,255,255,0.18)', btn:'#3A3C40', goldEdge:null },
  light: { shell:'#FAFAFB', strip:'#ECECEE', label:'#1D1D1F', label2:'#6B5F4E', label3:'#6B6459',
    cool:'#4E5A63', cool2:'#5F6A73', hair:'#CBCED4', edge:'#AEB3BB', rim:'#66717A',
    gold:'#E8B84B', goldText:'#825E0F', ember:'#7A5E2A', emberText:'#7A5A22', failure:'#B03327',
    magenta:'#752C68', glowA:0.10, socket:'#DFE1E4', well:'#E9EAEC', raised:'#FAFAFB',
    wash:'rgba(0,0,0,0.06)', washSel:'rgba(0,0,0,0.18)', btn:'#FFFFFF', goldEdge:'#7A5E2A' }
};

// 18 pt glyph box, stroked in currentColor (stand-ins for the SF Symbols)
const G = {
  laptop:'<rect x="3.5" y="4" width="11" height="7.5" rx="1.2"/><path d="M1.5 13.6h15"/>',
  homepod:'<rect x="5" y="2.5" width="8" height="13" rx="3.4"/><path d="M5.6 5.2c1.9 .9 4.9 .9 6.8 0"/>',
  tv:'<rect x="2" y="3.5" width="14" height="9.5" rx="1.5"/><path d="M6 15.5h6"/>',
  mixer:'<rect x="2" y="10" width="14" height="5" rx="1.4"/><path d="M5 12.5h.1M8 12.5h.1M11 12.5h.1"/><path d="M6.2 7.2a4 4 0 0 1 5.6 0M4.4 5.2a6.6 6.6 0 0 1 9.2 0"/>',
  speaker:'<rect x="4.5" y="1.8" width="9" height="14.4" rx="2"/><circle cx="9" cy="10.9" r="2.8"/><circle cx="9" cy="5.3" r="1.1"/>',
  sofa:'<path d="M3.5 9V6.5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2V9"/><path d="M2.5 9.2a1.4 1.4 0 0 1 2.8 0v1.6h7.4V9.2a1.4 1.4 0 0 1 2.8 0V14H2.5z"/><path d="M4 14v1.6M14 14v1.6"/>',
  house:'<path d="M2.5 8.6 9 3l6.5 5.6"/><path d="M4.4 7.3V15h9.2V7.3"/><path d="M7.6 15v-4h2.8v4"/>',
  sparkles:'<path d="M8 2.5l1.4 4 4 1.4-4 1.4L8 13.3l-1.4-4-4-1.4 4-1.4z"/><path d="M13.6 11.2l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
  sliders:'<path d="M3 5h12M3 9h12M3 13h12"/><circle cx="6.5" cy="5" r="1.5" fill="currentColor"/><circle cx="11.5" cy="9" r="1.5" fill="currentColor"/><circle cx="8" cy="13" r="1.5" fill="currentColor"/>',
  group:'<rect x="2" y="3" width="6" height="5" rx="1.2"/><rect x="2" y="10" width="6" height="5" rx="1.2"/><rect x="10" y="3" width="6" height="12" rx="1.2"/>',
  speakers:'<rect x="5" y="2" width="8" height="14" rx="2"/><circle cx="9" cy="11" r="2.4"/>',
  gear:'<circle cx="9" cy="9" r="2.6"/><path d="M9 1.8v2.4M9 13.8v2.4M1.8 9h2.4M13.8 9h2.4M3.9 3.9l1.7 1.7M12.4 12.4l1.7 1.7M3.9 14.1l1.7-1.7M12.4 5.6l1.7-1.7"/>',
  pin:'<path d="M6.5 2.5h5M7.3 2.5v4.2L5 10h8l-2.3-3.3V2.5M9 10v5.5"/>',
  plus:'<path d="M9 3.5v11M3.5 9h11"/>',
  chevR:'<path d="M7 4.5 11.5 9 7 13.5"/>',
  chevD:'<path d="M4.5 7 9 11.5 13.5 7"/>',
  pencil:'<path d="M3.5 14.5l1-3.6 7.6-7.6 2.6 2.6-7.6 7.6z"/>'
};
const glyph = (k, size, color, x, y, w = 1.4) =>
  `<svg class="abs" style="left:${x}px;top:${y}px;color:${color}" width="${size}" height="${size}" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${G[k]}</svg>`;

const FLEET = [
  { name:'MacBook Pro Speakers', g:'laptop' }, { name:'Bedroom HomePod', g:'homepod' },
  { name:'Living Room TV', g:'tv' }, { name:'Mixer', g:'mixer' }, { name:'Move 2', g:'speaker' },
  { name:'Office', g:'speaker' }, { name:'Sonos Move', g:'speaker' },
  { name:'Den', g:'speaker', unavailable:true }
];
const SCENES = {
  down:  { name:'Downstairs', g:'sofa', playing:true, members:['Office','Sonos Move'],
           pills:[{t:'System', on:true}] },
  house: { name:'Whole House', g:'house', members:['MacBook Pro Speakers','Bedroom HomePod','Living Room TV','Mixer','Move 2','Office','Sonos Move'],
           pills:[{t:'Music', on:true},{t:'Safari', on:false}] },
  party: { name:'Party', g:'sparkles', members:['Bedroom HomePod','Office','Sonos Move','Den'], pills:[] }
};

// Column geometry (PopoverColumnGrid at 713 pt)
const X = { rail:20, icon:38.5, iconInd:54.5, name:73.5, nameInd:89.5, title:58.5,
            readL:453, readW:40, trail:499, trailW:200, chev:683 };

function subline(s, c) {
  const una = s.members.filter(m => FLEET.find(f => f.name === m)?.unavailable);
  const avail = s.members.filter(m => !una.includes(m)).join(', ');
  if (!una.length) return avail;
  const lead = una.length === 1 ? `${una[0]} unavailable` : `${una.length} unavailable`;
  return `<span style="font-weight:500;color:${c.cool}">${lead}</span> · ${avail}`;
}

function frame(theme, rows, opts = {}) {
  const c = T[theme];
  let html = '', fg = '', bg = '';
  let y = 34 + 8;
  const anyPlaying = rows.some(r => r.type === 'scene' && SCENES[r.id].playing);

  // toolbar strip (shared chrome, drawn plainly)
  html += `<div class="abs" style="left:0;top:0;width:713px;height:34px;background:${c.strip};border-bottom:1px solid ${c.hair}"></div>`;
  const tabs = [['sliders',28.5],['group',78],['speakers',29.5],['gear',30]];
  let tx = 17; const capW = tabs.reduce((a,t)=>a+t[1],0)+6;
  html += `<div class="abs" style="left:14px;top:3px;width:${capW}px;height:28px;border-radius:14px;background:${c.wash}"></div>`;
  tabs.forEach(([k,w],i) => {
    if (i === 1) {
      html += `<div class="abs" style="left:${tx}px;top:3px;width:${w}px;height:28px;border-radius:14px;background:${c.washSel}"></div>`;
      html += glyph(k, 15, c.label, tx + 7.5, 9.5);
      html += `<div class="abs" style="left:${tx+28}px;top:11px;font-size:11px;font-weight:500;color:${c.label}">Scenes</div>`;
    } else html += glyph(k, 15, c.label2, tx + (w-15)/2, 9.5);
    tx += w;
  });
  html += `<div class="abs" style="left:0;width:713px;top:10px;text-align:center;font-size:12px;font-weight:600;color:${c.label2}">Audiout</div>`;
  html += glyph('pin', 15, c.label2, 676, 9.5);

  for (const r of rows) {
    if (r.type === 'header') {
      const tc = anyPlaying ? c.goldText : c.label2;
      html += `<div class="abs" style="left:${X.title}px;top:${y+8}px;font-size:11px;font-weight:600;color:${tc}">Scenes</div>`;
      if (r.legends !== false) {
        html += `<div class="abs" style="left:${X.readL-20}px;width:${X.readW+40}px;top:${y+8}px;text-align:center;font-size:11px;font-weight:500;color:${c.label2}">Speakers</div>`;
        html += `<div class="abs" style="left:${X.trail}px;width:${X.trailW}px;top:${y+8}px;text-align:center;font-size:11px;font-weight:500;color:${c.label2}">Source</div>`;
      }
      y += 28;
    }
    else if (r.type === 'scene') {
      const s = SCENES[r.id], H = 44, cy = y + 22;
      const tone = s.playing ? c.gold : c.ember;
      // glow behind the seat (identity)
      bg += `<circle cx="51.5" cy="${cy}" r="30" fill="url(#glow-${theme})"/>`;
      // ring + hook (the scene is an origin)
      fg += `<circle cx="51.5" cy="${cy}" r="16.2" fill="none" stroke="${tone}" stroke-width="1.6"/>`;
      fg += `<path d="M34.5 ${cy} C24.5 ${cy} 20 ${cy+6} 20 ${cy+16}" fill="none" stroke="${tone}" stroke-width="2" stroke-linecap="round"/>`;
      if (!r.open) fg += `<circle cx="20" cy="${cy+16}" r="2.5" fill="${tone}"/>`;
      html += glyph(s.g, 18, s.playing ? c.label : c.cool, 42.5, cy - 9);
      if (r.renaming) {
        html += `<div class="abs" style="left:69px;top:${y+3}px;width:196px;height:21px;border-radius:5px;background:${c.well};border:1px solid ${c.edge}"></div>`;
        html += `<div class="abs" style="left:74px;top:${y+5.5}px;font-size:13px;color:${c.label}"><span style="background:${theme==='dark'?'#3F638B':'#B3D7FF'}">Party</span></div>`;
        html += glyph('pencil', 12, c.cool2, 248, y + 7.5, 1.3);
        html += `<div class="abs ell" style="left:${X.name}px;top:${y+27}px;width:366px;font-size:11px;line-height:13px;color:${c.cool}">${subline(s,c)}</div>`;
      } else {
        html += `<div class="abs" style="left:${X.name}px;top:${y+6}px;font-size:13px;line-height:16px;color:${s.playing?c.label:c.cool}">${s.name}</div>`;
        html += `<div class="abs ell" style="left:${X.name}px;top:${y+24}px;width:366px;font-size:11px;line-height:14px;color:${c.cool}">${subline(s,c)}</div>`;
      }
      html += `<div class="abs" style="left:${X.readL}px;width:${X.readW}px;top:${y+14}px;text-align:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:${s.playing?c.goldText:c.emberText}">${s.members.length}</div>`;
      html += `<div class="abs" style="left:${X.trail}px;top:${y+13}px">` +
        s.pills.map(p => `<span class="pill" style="background:${c.well};border-color:${c.rim};color:${p.on?c.goldText:c.cool}">${p.t}</span>`).join('') + `</div>`;
      html += glyph(r.open ? 'chevD' : 'chevR', 14, c.cool2, X.chev + 1, cy - 7, 1.8);
      y += H;

      if (r.open) {
        // member rows + rail
        const lastMember = Math.max(...FLEET.map((f,i) => s.members.includes(f.name) ? i : -1));
        let pen = cy + 16, path = `M20 ${pen}`, nodes = '';
        FLEET.forEach((f, i) => {
          const top = y, yc = top + 21, isM = s.members.includes(f.name);
          if (i <= lastMember) {
            if (isM) {
              path += ` L20 ${yc - 7.5 - 3}`;
              if (f.unavailable) nodes += `<circle cx="20" cy="${yc}" r="6" fill="${c.socket}" stroke="${tone}" stroke-width="3"/>`;
              else nodes += `<circle cx="20" cy="${yc}" r="7.5" fill="${tone}" ${c.goldEdge && s.playing ? `stroke="${c.goldEdge}" stroke-width="1"`:''}/>`;
              path += ` M20 ${yc + 7.5 + 3}`;
            } else {
              path += ` L20 ${yc-14} C20 ${yc-6} 8 ${yc-8} 8 ${yc} C8 ${yc+8} 20 ${yc+6} 20 ${yc+14}`;
              nodes += `<circle cx="20" cy="${yc}" r="4.7" fill="none" stroke="${c.ember}" stroke-width="1.6"/>`;
            }
          } else {
            nodes += `<circle cx="20" cy="${yc}" r="4.7" fill="none" stroke="${c.ember}" stroke-width="1.6"/>`;
          }
          const nameC = f.unavailable ? c.cool : c.label;
          html += glyph(f.g, 18, f.unavailable ? c.cool2 : c.cool, 58.5, yc - 9);
          html += `<div class="abs" style="left:${X.nameInd}px;top:${top+13}px;font-size:13px;line-height:16px;color:${nameC}">${f.name}</div>`;
          if (f.unavailable) html += `<div class="abs" style="left:${X.trail}px;top:${top+14}px;font-size:11px;color:${c.cool2}">Unavailable</div>`;
          y += 42;
        });
        fg += `<path d="${path}" fill="none" stroke="${tone}" stroke-width="2" stroke-linecap="round"/>` + nodes;
        // body row: delete + note
        html += `<div class="abs" style="left:${X.nameInd}px;top:${y+10}px;height:22px;padding:0 10px;border-radius:6px;background:${c.btn};border:1px solid ${c.edge};font-size:12px;line-height:20px;color:${c.label}">Delete scene…</div>`;
        html += `<div class="abs" style="left:${X.nameInd+118}px;top:${y+14}px;font-size:11px;color:${c.label2}">${s.playing ? 'Changes are saved as you go. They don’t change what’s playing now.' : 'Changes are saved as you go.'}</div>`;
        y += 42;
      }
    }
    else if (r.type === 'message') {
      html += `<div class="abs" style="left:${X.name}px;top:${y+10}px;font-size:13px;color:${c.label2}">No scenes yet</div>`;
      html += `<div class="abs" style="left:${X.name}px;top:${y+30}px;font-size:11px;font-weight:500;color:${c.label2};white-space:normal;width:560px">Save a set of speakers as a scene, then switch to it in two clicks from the menu bar.</div>`;
      y += 58;
    }
    else if (r.type === 'add') {
      html += glyph('plus', 13, c.label2, X.icon, y + 14.5, 1.6);
      html += `<div class="abs" style="left:${X.icon+19}px;top:${y+13}px;font-size:13px;color:${c.label2}">Add scene</div>`;
      y += 42;
    }
  }
  // host footer caption
  html += `<div class="abs" style="left:0;width:713px;top:${y+8}px;text-align:center;font-size:11px;color:${c.label2}">Set up scenes here, then switch to the Mixer to play</div>`;
  y += 34;

  const defs = `<defs><radialGradient id="glow-${theme}"><stop offset="0" stop-color="${c.magenta}" stop-opacity="${c.glowA}"/><stop offset="1" stop-color="${c.magenta}" stop-opacity="0"/></radialGradient></defs>`;
  return `<div class="shell" style="height:${y}px;background:${c.shell};box-shadow:0 0 0 1px ${theme==='dark'?'#3D4247':'#AEB3BB'}">
    <svg class="layer" width="713" height="${y}">${defs}${bg}</svg>
    ${html}
    <svg class="layer" width="713" height="${y}">${fg}</svg></div>`;
}

const overview = [{type:'header'},{type:'scene',id:'down'},{type:'scene',id:'house'},{type:'scene',id:'party'},{type:'add'}];
const editor   = [{type:'header'},{type:'scene',id:'down'},{type:'scene',id:'house'},{type:'scene',id:'party',open:true,renaming:true},{type:'add'}];
const empty    = [{type:'header',legends:false},{type:'message'},{type:'add'}];

const cells = [
  ['Overview · dark', 'Every scene folded. Downstairs is what Main Audio plays to: gold ring, System pill, gold count.', 'dark', overview],
  ['Overview · light', 'A ring around a seat means a scene. Each folded hook ends on the Mixer’s collapsed-section dot.', 'light', overview],
  ['Editor (Party opened in place) · dark', 'Rail dots toggle membership. Den is a member the Mac can’t reach. The name is being renamed inline.', 'dark', editor],
  ['Editor (Party opened in place) · light', 'Non-members keep the detour arc; the rail ends at the last member, Den.', 'light', editor],
  ['Empty · dark', 'No rail, because nothing is reached. Add scene sits where it always sits.', 'dark', empty],
  ['Empty · light', '', 'light', empty]
];
document.getElementById('grid').innerHTML = cells.map(([l,n,t,rows]) =>
  `<div><div class="label">${l}</div><div class="note">${n}</div>${frame(t, rows)}</div>`).join('');
</script>
</body>
</html>
