name: Marketing videos

# Renders the Remotion compositions under marketing/video/ and uploads the MP4s
# as build artifacts. Nobody has to render locally to see a change.

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'One composition id to render (blank renders all)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'marketing/video/**'
      - '.github/workflows/marketing-video.yml'

concurrency:
  group: marketing-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    # macOS, not Linux: the videos rebuild the app's panel and set their type in
    # SF Pro, which only exists on a Mac. A Linux runner would silently fall back
    # to DejaVu Sans and every frame would be wrong. This repo is public, so
    # macOS runners are free.
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: marketing/video

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/video/package-lock.json

      - name: Install
        run: npm ci

      - name: Fetch the headless browser Remotion renders with
        run: npx remotion browser ensure

      - name: Type-check
        run: npx tsc --noEmit

      - name: Render
        env:
          ONLY: ${{ inputs.composition }}
        run: |
          set -euo pipefail
          mkdir -p out
          rendered=0
          for id in $(npx remotion compositions --quiet); do
            if [ -n "${ONLY}" ] && [ "$id" != "${ONLY}" ]; then
              continue
            fi
            echo "::group::render $id"
            npx remotion render "$id" "out/$id.mp4" --log=info
            echo "::endgroup::"
            rendered=$((rendered + 1))
          done
          if [ "$rendered" -eq 0 ]; then
            echo "No composition matched '${ONLY}'." >&2
            exit 1
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: audiout-marketing-videos
          path: marketing/video/out/*.mp4
          if-no-files-found: error
          retention-days: 30
